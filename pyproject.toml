[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanohub-padre"
dynamic = ["version"]
dependencies = [
    "numpy",
]
description = "Python library for creating and running PADRE semiconductor device simulations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "nanohub-padre Contributors"}
]
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["semiconductor", "device simulation", "PADRE", "TCAD"]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Documentation = "https://nanohub-padre.readthedocs.io/"
Repository = "https://github.com/nanohub/padre"
Issues = "https://github.com/nanohub/padre/issues"

[tool.setuptools.dynamic]
version = {attr = "nanohubpadre._version.__version__"}

# Explicit package list (do NOT use packages.find): the repo root contains
# symlinks to sibling projects (nanohub-mcp, padre-web) with ~130k files of
# node_modules/build output. find_packages() follows those symlinks and the
# tree walk hangs for minutes. Listing packages explicitly avoids the walk.
[tool.setuptools]
packages = ["nanohubpadre", "nanohubpadre.devices"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
